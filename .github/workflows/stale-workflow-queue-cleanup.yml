name: Stale Workflow Queue Cleanup

on:
  workflow_dispatch:
  schedule:
  # everyday at 15:00
  - cron: '0 15 * * *'

permissions:
  contents: read

concurrency:
  group: stale-workflow-queue-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cleanup
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: write # to delete stale workflow runs

    steps:
    - name: Delete stale queued workflow runs
      uses: actions/github-script@v8
      with:
        script: |
          const olderThanSeconds = 86400;
          const cutoff = Date.now() - (olderThanSeconds * 1000);
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          let page = 1;
          let deleted = 0;

          while (true) {
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              status: 'queued',
              per_page: 100,
              page,
            });

            const runs = response.data.workflow_runs || [];
            if (runs.length === 0) {
              break;
            }

            for (const run of runs) {
              const created = new Date(run.created_at).getTime();
              if (created <= cutoff) {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                deleted += 1;
                core.info(`Deleted queued run ${run.id} (${run.name})`);
              }
            }

            if (runs.length < 100) {
              break;
            }

            page += 1;
          }

          core.info(`Deleted ${deleted} queued workflow run(s) older than ${olderThanSeconds} seconds.`);
