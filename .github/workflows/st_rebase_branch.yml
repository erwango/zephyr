name: Rebase dev/genai branch on upstream main

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: st-rebase-dev-genai
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu22-basic
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REBASE_PUSH_TOKEN }}

      - name: Rebase branches on upstream main
        env:
          REBASE_PUSH_TOKEN: ${{ secrets.REBASE_PUSH_TOKEN }}
          GIT_EDITOR: true
          EDITOR: true
          VISUAL: true
        run: |
          set -eu

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/zephyrproject-rtos/zephyr.git
          git fetch --no-tags upstream main

          if [ -z "${REBASE_PUSH_TOKEN:-}" ]; then
            echo "Set REBASE_PUSH_TOKEN for this workflow." >&2
            exit 1
          fi

          target_branch="dev/genai"
          git fetch --no-tags origin "$target_branch"
          git checkout -B "$target_branch" "origin/$target_branch"

          if ! git rebase -X ours upstream/main; then
            while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
              conflicted_files="$(git diff --name-only --diff-filter=U || true)"

              if [ -n "$conflicted_files" ]; then
                echo "$conflicted_files" | while IFS= read -r conflicted_file; do
                  if [ -n "$conflicted_file" ]; then
                    git rm -f -- "$conflicted_file"
                  fi
                done
              fi

              if git rebase --continue; then
                continue
              fi

              conflicted_files="$(git diff --name-only --diff-filter=U || true)"
              if [ -n "$conflicted_files" ]; then
                continue
              fi

              if [ -z "$(git status --porcelain)" ]; then
                git rebase --skip
                continue
              fi

              echo "Unable to auto-resolve rebase conflict." >&2
              git status --short
              exit 1
            done
          fi

          # Keep only internal workflows in this branch after each upstream rebase.
          keep_file="$(mktemp)"
          {
            printf '%s\n' "st_blackduck_license_pr_scan.yml"
            printf '%s\n' "st_rebase_branch.yml"
            printf '%s\n' "st_rebase_main_zephyr_osf.yml"
          } > "$keep_file"

          if [ -d .github/workflows ]; then
            while IFS= read -r workflow_file; do
              workflow_name="$(basename "$workflow_file")"

              if ! grep -Fxq "$workflow_name" "$keep_file"; then
                if git ls-files --error-unmatch "$workflow_file" >/dev/null 2>&1; then
                  git rm -f -- "$workflow_file"
                else
                  rm -f -- "$workflow_file"
                fi
              fi
            done < <(find .github/workflows -maxdepth 1 -type f \
              \( -name '*.yml' -o -name '*.yaml' \) | sort)
          fi

          rm -f -- "$keep_file"

          if [ -n "$(git status --porcelain -- .github/workflows)" ]; then
            git add .github/workflows
            commit_body="Automatically generated by the dev/genai rebase workflow."
            commit_body="$commit_body\n\nOnly workflows in the internal allowlist are permitted:"
            commit_body="$commit_body\n  - st_blackduck_license_pr_scan.yml"
            commit_body="$commit_body\n  - st_rebase_branch.yml"
            commit_body="$commit_body\n  - st_rebase_main_zephyr_osf.yml"
            commit_body="$commit_body\n\nAny workflow file introduced by upstream rebase that"
            commit_body="$commit_body is not in the allowlist is removed here to prevent"
            commit_body="$commit_body unintended CI execution."
            git commit \
              -m ".github: remove non-allowlisted upstream workflows" \
              -m "$(printf '%b' "$commit_body")"
          fi

          git push --force-with-lease origin HEAD:"$target_branch"
